[pytest]
; pythonpath = . : de "import app...." hoat dong khi chay pytest tu project root
pythonpath = .
; testpaths = tests : CHI gom test trong tests/. QUAN TRONG: o root con 3 file
; test_*.py thu cong (test_gemini.py...) goi API THAT — khong duoc de pytest tu gom.
testpaths = tests
; -q: output gon | --strict-markers: marker go sai ten -> loi ngay thay vi im lang
; -m "not live": mac dinh LOAI test goi Gemini that (chay rieng: pytest -m live)
addopts = -q --strict-markers -m "not live"
markers =
    live: test goi Gemini API that (ton tien, can mang) - chi chay khi duoc yeu cau ro
